# Configuration example: linked files must exist on the target connector.
regex=status=(\\d+) message=(.*)
token.count=2
token[0].name=Status
token[0].type=String
token[1].name=Message
token[1].type=String
event.deviceSeverity=Status
event.message=Message

severity.map.veryhigh.if.deviceSeverity=600..699
severity.map.high.if.deviceSeverity=400..599
severity.map.medium.if.deviceSeverity=300..399
severity.map.low.if.deviceSeverity=100..299

extraprocessor.count=2
extraprocessor[0].type=regex
extraprocessor[0].filename=custom/detail
extraprocessor[0].field=event.message
extraprocessor[0].flexagent=true
extraprocessor[0].clearfieldafterparsing=false
extraprocessor[1].type=map
extraprocessor[1].filename=custom/severity.csv
extraprocessor[1].allowoverwrite=false

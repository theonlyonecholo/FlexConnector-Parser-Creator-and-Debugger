# Offline event preview example. Choose this examples directory as dependency root.
regex=user=(\\w+) action=(\\w+) port=(\\d+)
token.count=3
token[0].name=User
token[0].type=String
token[1].name=Action
token[1].type=String
token[2].name=Port
token[2].type=Integer
event.name=__stringConstant(Original)
event.sourceUserName=__toLowerCase(User)
event.deviceAction=Action
event.destinationPort=Port
additionaldata.originalUser=User
conditionalmap.count=1
conditionalmap[0].token=Action
conditionalmap[0].mappings.count=2
conditionalmap[0].mappings[0].values=allow
conditionalmap[0].mappings[0].event.name=__concatenate("Allowed ",User)
conditionalmap[0].mappings[1].event.name=__stringConstant(Denied)
extraprocessor.count=2
extraprocessor[0].type=map
extraprocessor[0].filename=event-pipeline-ports.csv
extraprocessor[0].allowoverwrite=false
extraprocessor[0].charencoding=UTF-8
extraprocessor[1].type=map
extraprocessor[1].filename=event-pipeline-protocols.csv
extraprocessor[1].charencoding=UTF-8

# Windows MSWinEventLog example: tab-separated fields, regex-only submessage selection.
# Load the .log file to preserve actual tabs. Empty fields must remain present.
do.unparsed.events=true
regex=(MSWinEventLog)\\t([^\\t]*)\\t([^\\t]*)\\t([^\\t]*)\\t([^\\t]*)\\t([^\\t]*)\\t([^\\t]*)\\t([^\\t]*)\\t([^\\t]*)\\t([^\\t]*)\\t([^\\t]*)\\t([^\\t]*)\\t([^\\t]*)\\t([^\\t]*)\\t([^\\t]*)
token.count=15
token[0].name=MessageType
token[0].type=String
token[1].name=MSWinEventLogFormatOrVersion
token[1].type=String
token[2].name=WindowsEventLogChannel
token[2].type=String
token[3].name=WindowsEventRecordId
token[3].type=String
token[4].name=WindowsEventTimestamp
token[4].type=TimeStamp
token[5].name=WindowsEventId
token[5].type=String
token[6].name=EventProviderSource
token[6].type=String
token[7].name=Account
token[7].type=String
token[8].name=AccountType
token[8].type=String
token[9].name=WindowsEventLevel
token[9].type=String
token[10].name=Hostname
token[10].type=String
token[11].name=Info
token[11].type=String
token[12].name=Something
token[12].type=String
token[13].name=Message
token[13].type=String
token[14].name=Size
token[14].type=String
token[4].format=EEE MMM dd HH:mm:ss yyyy

submessage.token=Message
trim.submessage=false
# No message-ID token: the default definition tries its patterns in order.
submessage.count=1
submessage[0].pattern.count=4

# DROP: entire message, address and port.
submessage[0].pattern[0].regex=(\\[DROP\\] Dropping received RCP messages from ((?:\\d{1,3}\\.){3}\\d{1,3}):(\\d{1,5})\\.)
submessage[0].pattern[0].fields=event.message,event.sourceAddress,event.sourcePort
submessage[0].pattern[0].types=String,IPAddress,Integer

# Signature validation: message prefix, address and port.
submessage[0].pattern[1].regex=(Validation of RCP packet failed[^\\t]*)\\sSender:\\s+((?:\\d{1,3}\\.){3}\\d{1,3}):(\\d{1,5})\\.?
submessage[0].pattern[1].fields=event.message,event.sourceAddress,event.sourcePort
submessage[0].pattern[1].types=String,IPAddress,Integer

submessage[0].pattern[2].regex=(N/A)
submessage[0].pattern[2].fields=event.message

# Simple status text; not an unrestricted catch-all.
submessage[0].pattern[3].regex=([A-Za-z0-9. ]+)
submessage[0].pattern[3].fields=event.message

event.deviceVendor=__stringConstant(Microsoft)
event.deviceProduct=__stringConstant(Windows)
event.deviceHostName=Hostname
event.name=EventProviderSource
event.message=Message
event.externalId=WindowsEventRecordId
event.deviceEventClassId=WindowsEventId
event.sourceUserName=Account
event.sourceUserPrivileges=AccountType
event.endTime=WindowsEventTimestamp

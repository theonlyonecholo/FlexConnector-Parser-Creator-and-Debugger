# Local category-map example. Deploy categories.csv under user/agent/aup/fcp/.
regex=id=(\\w+) message=(.*)
token.count=2
token[0].name=Id
token[0].type=String
token[1].name=Message
token[1].type=String
event.deviceVendor=__stringConstant(Example)
event.deviceProduct=__stringConstant(Demo)
event.deviceEventClassId=Id
event.message=Message
extraprocessor.count=1
extraprocessor[0].type=map
extraprocessor[0].filename=categories.csv
extraprocessor[0].charencoding=UTF-8
extraprocessor[0].casesensitive=false
extraprocessor[0].trimgettertokens=true
extraprocessor[0].trimsettertokens=true
extraprocessor[0].allowoverwrite=true
